name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPARC_BUILD_TESTS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
